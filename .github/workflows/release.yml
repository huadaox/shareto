name: Release & APT Repository

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release Assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Version
        id: get_version
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(grep 'VERSION ?=' Makefile | head -n1 | awk '{print $3}')"
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building version: ${VERSION}"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Run Tests
        run: go test -v -race ./...

      - name: Install nfpm
        run: |
          NFPM_VERSION="2.41.1"
          curl -fsSL "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz" | sudo tar -C /usr/local/bin -xz nfpm
          nfpm --version

      - name: Build All Architectures (amd64, arm64)
        env:
          VERSION: ${{ steps.get_version.outputs.VERSION }}
        run: |
          make package-all VERSION="${VERSION}"
          cd dist
          sha256sum *.deb *.rpm *.tar.gz > sha256sums.txt
          ls -la

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz
            dist/sha256sums.txt
          generate_release_notes: true
          draft: false
          prerelease: false

      - name: Upload deb Artifacts for APT Job
        uses: actions/upload-artifact@v4
        with:
          name: deb-packages
          path: dist/*.deb
          retention-days: 1

  publish-apt-repo:
    name: Publish APT Repository to GitHub Pages
    needs: build-and-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Checkout gh-pages Branch
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: public

      - name: Download Built deb Packages
        uses: actions/download-artifact@v4
        with:
          name: deb-packages
          path: dist

      - name: Install reprepro
        run: sudo apt-get update && sudo apt-get install -y reprepro gpg

      - name: Import GPG Key (if secret configured)
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          if [ -n "${GPG_PRIVATE_KEY}" ]; then
            echo "Importing provided GPG private key..."
            echo "${GPG_PRIVATE_KEY}" | gpg --batch --import --no-tty
            KEY_ID=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec:/ {print $5; exit}')
            echo "GPG_KEY_ID=${KEY_ID}" >> "$GITHUB_ENV"
          else
            echo "No GPG_PRIVATE_KEY secret configured; script will generate signing key."
          fi

      - name: Build & Update APT Repository
        run: |
          REPO_DIR=public DEB_DIR=dist ./packaging/update-apt-repo.sh

      - name: Deploy to GitHub Pages Branch (gh-pages)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          keep_files: false

  build-macos:
    name: Build macOS Universal Installer
    needs: build-and-release
    runs-on: macos-latest
    env:
      TMPDIR: ${{ github.workspace }}/work/tmp
      GOTMPDIR: ${{ github.workspace }}/work/tmp
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: mkdir -p work/tmp
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: stable
      - name: Verify and Build macOS Packages
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
        run: bash packaging/release-macos.sh
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/*_darwin_universal.pkg
            dist/*_darwin_universal.tar.gz
            dist/sha256sums-macos.txt
      - uses: actions/upload-artifact@v4
        with:
          name: macos-packages
          path: |
            dist/*_darwin_universal.pkg
            dist/*_darwin_universal.tar.gz
            dist/sha256sums-macos.txt

  build-windows:
    name: Build Windows Packages
    needs: build-and-release
    runs-on: ubuntu-latest
    env:
      TMPDIR: ${{ github.workspace }}/work/tmp
      GOTMPDIR: ${{ github.workspace }}/work/tmp
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: mkdir -p work/tmp
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
      - name: Ensure zip is available
        run: command -v zip >/dev/null || sudo apt-get update -qq && sudo apt-get install -y -qq zip
      - name: Build and package Windows archives
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(make print-version)"
          fi
          echo "Building Windows packages for ${VERSION}"
          make windows VERSION="${VERSION}"
          ls -la dist/*_windows_*.zip dist/sha256sums-windows.txt
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/*_windows_*.zip
            dist/sha256sums-windows.txt
      - uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: |
            dist/*_windows_*.zip
            dist/sha256sums-windows.txt
